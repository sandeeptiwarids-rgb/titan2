# titan2 CI: tests only (DETAIL §13.6). There is deliberately no deploy job and no secret here. Deploys run from
# the operator's machine with ops/deploy.sh (preflight, drift check, self-check, atomic switch,
# rollback). v1's deploy.yml restarted titan-bot on every push to main; Stage 0 disables and deletes it.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: pytest, ubuntu, Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the hash-locked dependencies
        run: python -m pip install --require-hashes --only-binary :all: -r requirements-dev.txt
      - name: Run the whole suite
        run: python -m pytest tests -q -p no:cacheprovider

  windows:
    name: pytest unit and arch, windows, Python 3.12
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the hash-locked dependencies
        run: python -m pip install --require-hashes --only-binary :all: -r requirements-dev.txt
      - name: Run the unit and architecture tests
        run: python -m pytest tests/unit tests/arch -q -p no:cacheprovider
